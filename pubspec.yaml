name: intiva_mobile_application
description: "Resolum Official Mobile Application to manage credit car's payment plans"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.3.2
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2

  # Secure Storage
  flutter_secure_storage: ^10.2.0

  # di
  get_it: ^9.2.1

  # Routing
  go_router: ^17.2.3

  # Launched Icons
  flutter_launcher_icons: ^0.14.4

  cupertino_icons: ^1.0.8

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/intiva.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
